<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 350px; padding: 10px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .port-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; }
    .port-bar input { width: 62px; padding: 3px 6px; border: 1px solid #d0d7de; border-radius: 4px; }
    .conn-ok { color: #1a7f37; font-weight: 600; }
    .conn-err { color: #cf222e; font-weight: 600; }
    .item { border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .url { font-size: 12px; word-break: break-all; margin-bottom: 6px; color: #24292f; }
    button { cursor: pointer; border: none; border-radius: 4px; padding: 5px 10px; font-size: 12px; }
    .send { background: #0969da; color: white; }
    .clear { background: #eaeef2; color: #24292f; }
    .status { font-size: 12px; color: #57606a; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <strong>Captured .m3u8 Streams</strong>
    <button id="clearBtn" class="clear">Clear</button>
  </div>
  <div class="port-bar">
    <label for="portInput">App Port:</label>
    <input id="portInput" type="number" min="1024" max="65535" value="8765" />
    <span id="connBadge" class="conn-err">Checking...</span>
  </div>
  <div id="list"></div>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
